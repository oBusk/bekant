[package]
name = "bekant"
version = "0.1.0"
edition = "2024"
license = "MIT"

[profile.release]
opt-level = "z"     # optimize for size; speed doesn't matter for this app
lto = true          # link-time optimization across crates
codegen-units = 1   # better optimization, slower build
panic = "abort"     # no stack-unwinding machinery
strip = true        # remove symbols from the exe

[dependencies]
anyhow = "1.0.104"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_System_Com", "Win32_UI_Input_KeyboardAndMouse"] }
winvd = "0.0.49"
